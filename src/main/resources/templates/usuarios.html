<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .navbar { background: #1a73e8; padding: 14px 30px; display: flex; align-items: center; gap: 20px; }
        .navbar h1 { color: white; font-size: 20px; flex: 1; }
        .navbar a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; }
        .navbar a:hover { background: rgba(255,255,255,0.2); }
        .container { margin: 24px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #1a73e8; margin-bottom: 16px; font-size: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 13px; color: #555; font-weight: bold; }
        .form-group input, .form-group select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-search { background: #34a853; color: white; }
        .search-row { display: flex; gap: 10px; }
        .search-row select, .search-row input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #1a73e8; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f8f9ff; }
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .badge-admin { background: #e8eaf6; color: #3949ab; }
        .badge-medico { background: #e0f2f1; color: #00695c; }
        .badge-enfermera { background: #fce4ec; color: #c2185b; }
        .badge-recepcion { background: #fff3e0; color: #e65100; }
        #msg { padding: 10px; border-radius: 6px; margin-bottom: 12px; display: none; }
        .msg-ok { background: #e6f4ea; color: #2d8f47; }
        .msg-err { background: #fce8e6; color: #c5221f; }
    </style>
</head>
<body>
<nav class="navbar">
    <h1>Sistema Hospitalario</h1>
    <a href="/">Inicio</a>
    <a href="/pacientes">Pacientes</a>
    <a href="/atenciones">Atenciones</a>
    <a href="/seguros">Seguros</a>
    <a href="/contactos">Contactos</a>
    <a href="/usuarios">Usuarios</a>
    <a href="/bitacora">Bitácora</a>
    <label style="color:white;font-size:13px;display:flex;align-items:center;gap:6px">
        Rol de sesión:
        <select id="selRol" onchange="cambiarRol()" style="padding:4px 8px;border-radius:6px;border:none">
            <option value="ADMIN">Admin</option>
            <option value="MEDICO">Médico</option>
            <option value="ENFERMERA">Enfermera</option>
            <option value="RECEPCION">Recepción</option>
        </select>
    </label>
</nav>
<div class="container">

    <div class="card">
        <h2>Registrar Usuario</h2>
        <div id="msg"></div>
        <div class="form-grid">
            <div class="form-group">
                <label>Nombre de Usuario</label>
                <input type="text" id="nombreUsuario" placeholder="medico01">
            </div>
            <div class="form-group">
                <label>Rol</label>
                <select id="rol">
                    <option>ADMIN</option>
                    <option>MEDICO</option>
                    <option>ENFERMERA</option>
                    <option>RECEPCION</option>
                </select>
            </div>
        </div>
        <br>
        <button class="btn btn-primary" onclick="registrarUsuario()">Registrar Usuario</button>
    </div>

    <div class="card">
        <h2>Filtrar por Rol</h2>
        <div class="search-row">
            <select id="filtroRol">
                <option value="">Todos</option>
                <option>ADMIN</option>
                <option>MEDICO</option>
                <option>ENFERMERA</option>
                <option>RECEPCION</option>
            </select>
            <button class="btn btn-search" onclick="filtrar()">Filtrar</button>
            <button class="btn btn-primary" onclick="listarTodos()">Ver Todos</button>
        </div>
    </div>

    <div class="card">
        <h2>Lista de Usuarios</h2>
        <table>
            <thead>
                <tr><th>Usuario</th><th>Rol</th></tr>
            </thead>
            <tbody id="bodyUsuarios">
                <tr><td colspan="2" style="text-align:center;color:#888">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const API = 'http://localhost:8080';

function rolActual() {
    return localStorage.getItem('sesionRol') || 'ADMIN';
}
function cambiarRol() {
    localStorage.setItem('sesionRol', document.getElementById('selRol').value);
}
function headersConRol(conJson) {
    const h = { 'X-Rol': rolActual() };
    if (conJson) h['Content-Type'] = 'application/json';
    return h;
}

async function registrarUsuario() {
    const body = {
        nombreUsuario: document.getElementById('nombreUsuario').value,
        rol: document.getElementById('rol').value
    };
    const res = await fetch(`${API}/api/usuarios`, {
        method: 'POST',
        headers: headersConRol(true),
        body: JSON.stringify(body)
    });
    const msg = document.getElementById('msg');
    if (res.ok) {
        msg.className = 'msg-ok'; msg.style.display = 'block';
        msg.textContent = 'Usuario registrado correctamente.';
        listarTodos();
    } else {
        msg.className = 'msg-err'; msg.style.display = 'block';
        msg.textContent = await res.text() || 'Error al registrar usuario.';
    }
}

async function listarTodos() {
    const res = await fetch(`${API}/api/usuarios`, { headers: headersConRol(false) });
    if (!res.ok) return alert(await res.text());
    const data = await res.json();
    renderTabla(data);
}

async function filtrar() {
    const rol = document.getElementById('filtroRol').value;
    const url = rol ? `${API}/api/usuarios?rol=${rol}` : `${API}/api/usuarios`;
    const res = await fetch(url, { headers: headersConRol(false) });
    if (!res.ok) return alert(await res.text());
    const data = await res.json();
    renderTabla(data);
}

function renderTabla(lista) {
    const tbody = document.getElementById('bodyUsuarios');
    if (!lista.length) {
        tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;color:#888">Sin resultados</td></tr>';
        return;
    }
    tbody.innerHTML = lista.map(u => `
        <tr>
            <td>${u.nombreUsuario}</td>
            <td><span class="badge badge-${u.rol?.toLowerCase()}">${u.rol}</span></td>
        </tr>
    `).join('');
}

document.getElementById('selRol').value = rolActual();
listarTodos();
</script>
</body>
</html>

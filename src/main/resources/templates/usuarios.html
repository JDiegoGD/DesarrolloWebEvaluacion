<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .navbar { background: #1a73e8; padding: 14px 30px; display: flex; align-items: center; gap: 20px; }
        .navbar h1 { color: white; font-size: 20px; flex: 1; }
        .navbar a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; }
        .navbar a:hover { background: rgba(255,255,255,0.2); }
        .container { margin: 24px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #1a73e8; margin-bottom: 16px; font-size: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 13px; color: #555; font-weight: bold; }
        .form-group input, .form-group select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-search { background: #34a853; color: white; }
        .search-row { display: flex; gap: 10px; }
        .search-row select, .search-row input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #1a73e8; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f8f9ff; }
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        .badge-admin { background: #e8eaf6; color: #3949ab; }
        .badge-medico { background: #e0f2f1; color: #00695c; }
        .badge-enfermera { background: #fce4ec; color: #c2185b; }
        .badge-recepcion, .badge-recepcionista { background: #fff3e0; color: #e65100; }
        .badge-administrador { background: #e8eaf6; color: #3949ab; }
        .badge-inactivo { background: #eee; color: #777; }
        #msg { padding: 10px; border-radius: 6px; margin-bottom: 12px; display: none; }
        .msg-ok { background: #e6f4ea; color: #2d8f47; }
        .msg-err { background: #fce8e6; color: #c5221f; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container">

    <div class="card">
        <h2>Registrar Usuario</h2>
        <div id="msg"></div>
        <div class="form-grid">
            <div class="form-group">
                <label>Nombre de Usuario</label>
                <input type="text" id="nombreUsuario" placeholder="medico01">
            </div>
            <div class="form-group">
                <label>Nombres</label>
                <input type="text" id="nombres" placeholder="Juan Pérez">
            </div>
            <div class="form-group">
                <label>Correo (opcional)</label>
                <input type="email" id="correo" placeholder="juan@hospital.pe">
            </div>
            <div class="form-group">
                <label>Contraseña (mínimo 8 caracteres)</label>
                <input type="password" id="password" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>Rol</label>
                <select id="rol"></select>
            </div>
        </div>
        <br>
        <button class="btn btn-primary" onclick="registrarUsuario()">Registrar Usuario</button>
    </div>

    <div class="card">
        <h2>Filtrar por Rol</h2>
        <div class="search-row">
            <select id="filtroRol">
                <option value="">Todos</option>
            </select>
            <button class="btn btn-search" onclick="filtrar()">Filtrar</button>
            <button class="btn btn-primary" onclick="listarTodos()">Ver Todos</button>
        </div>
    </div>

    <div class="card">
        <h2>Lista de Usuarios</h2>
        <table>
            <thead>
                <tr><th>Id</th><th>Usuario</th><th>Nombres</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody id="bodyUsuarios">
                <tr><td colspan="7" style="text-align:center;color:#888">Cargando...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script>
const API = '';

function rolActual() {
    return localStorage.getItem('sesionRol') || 'ADMIN';
}
function cambiarRol() {
    localStorage.setItem('sesionRol', document.getElementById('selRol').value);
}
function headersConRol(conJson) {
    const h = { 'X-Rol': rolActual() };
    if (conJson) h['Content-Type'] = 'application/json';
    return h;
}

async function registrarUsuario() {
    const body = {
        nombreUsuario: document.getElementById('nombreUsuario').value,
        nombres: document.getElementById('nombres').value,
        correo: document.getElementById('correo').value || null,
        password: document.getElementById('password').value,
        rolId: Number(document.getElementById('rol').value) || null
    };
    const res = await apiFetch(`${API}/api/usuarios`, {
        method: 'POST',
        headers: headersConRol(true),
        body: JSON.stringify(body)
    });
    const msg = document.getElementById('msg');
    if (res.ok) {
        msg.className = 'msg-ok'; msg.style.display = 'block';
        msg.textContent = 'Usuario registrado correctamente.';
        document.getElementById('password').value = '';
        listarTodos();
    } else {
        msg.className = 'msg-err'; msg.style.display = 'block';
        msg.textContent = await res.text() || 'Error al registrar usuario.';
    }
}

async function listarTodos() {
    const res = await apiFetch(`${API}/api/usuarios`, { headers: headersConRol(false) });
    if (!res.ok) return alert(await res.text());
    const data = await res.json();
    renderTabla(data);
}

async function filtrar() {
    const rolId = document.getElementById('filtroRol').value;
    const url = rolId ? `${API}/api/usuarios?rolId=${rolId}` : `${API}/api/usuarios`;
    const res = await apiFetch(url, { headers: headersConRol(false) });
    if (!res.ok) return alert(await res.text());
    const data = await res.json();
    renderTabla(data);
}

async function eliminarUsuario(nombreUsuario) {
    if (!confirm(`¿Eliminar al usuario "${nombreUsuario}"?`)) return;
    const res = await apiFetch(`${API}/api/usuarios/${encodeURIComponent(nombreUsuario)}`, {
        method: 'DELETE',
        headers: headersConRol(false)
    });
    if (res.ok) {
        listarTodos();
    } else {
        alert(await res.text() || 'Error al eliminar usuario.');
    }
}

async function cambiarEstado(id, activo) {
    const res = await apiFetch(`${API}/api/usuarios/${id}/estado`, {
        method: 'PATCH',
        headers: headersConRol(true),
        body: JSON.stringify({ activo })
    });
    if (res.ok) listarTodos();
    else alert(await res.text() || 'Error al cambiar el estado.');
}

async function cargarRoles() {
    const res = await apiFetch(`${API}/api/roles?activo=true`, { headers: headersConRol(false) });
    if (!res.ok) return;
    const roles = await res.json();
    const opciones = roles.map(r => `<option value="${r.id}">${r.nombre}</option>`).join('');
    document.getElementById('rol').innerHTML = opciones;
    document.getElementById('filtroRol').innerHTML = '<option value="">Todos</option>' + opciones;
}

function renderTabla(lista) {
    const tbody = document.getElementById('bodyUsuarios');
    if (!lista.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#888">Sin resultados</td></tr>';
        return;
    }
    tbody.innerHTML = lista.map(u => `
        <tr>
            <td>${u.id}</td>
            <td>${u.nombreUsuario}</td>
            <td>${u.nombres ?? ''}</td>
            <td>${u.correo ?? ''}</td>
            <td><span class="badge badge-${u.rolNombre?.toLowerCase()}">${u.rolNombre}</span></td>
            <td><span class="badge ${u.activo ? 'badge-medico' : 'badge-inactivo'}">${u.activo ? 'Activo' : 'Inactivo'}</span></td>
            <td>
                <button class="btn" style="padding:4px 10px;font-size:12px;background:#757575;color:white" onclick="cambiarEstado(${u.id}, ${!u.activo})">${u.activo ? 'Desactivar' : 'Activar'}</button>
                <button class="btn" style="padding:4px 10px;font-size:12px;background:#e53935;color:white" onclick="eliminarUsuario('${u.nombreUsuario}')">Eliminar</button>
            </td>
        </tr>
    `).join('');
}

cargarRoles();
listarTodos();
</script>
</body>
</html>

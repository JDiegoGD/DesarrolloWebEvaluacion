<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contactos de Emergencia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .navbar { background: #1a73e8; padding: 14px 30px; display: flex; align-items: center; gap: 20px; }
        .navbar h1 { color: white; font-size: 20px; flex: 1; }
        .navbar a { color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; }
        .navbar a:hover { background: rgba(255,255,255,0.2); }
        .container { margin: 24px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #1a73e8; margin-bottom: 16px; font-size: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 13px; color: #555; font-weight: bold; }
        .form-group input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-search { background: #34a853; color: white; }
        .search-row { display: flex; gap: 10px; }
        .search-row input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #1a73e8; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f8f9ff; }
        #msg { padding: 10px; border-radius: 6px; margin-bottom: 12px; display: none; }
        .msg-ok { background: #e6f4ea; color: #2d8f47; }
        .msg-err { background: #fce8e6; color: #c5221f; }
    </style>
</head>
<body>
<nav class="navbar">
    <h1>Sistema Hospitalario</h1>
    <a href="/">Inicio</a>
    <a href="/pacientes">Pacientes</a>
    <a href="/atenciones">Atenciones</a>
    <a href="/seguros">Seguros</a>
    <a href="/contactos">Contactos</a>
    <a href="/usuarios">Usuarios</a>
    <a href="/bitacora">Bitácora</a>
</nav>
<div class="container">

    <div class="card">
        <h2>Registrar Contacto de Emergencia</h2>
        <div id="msg"></div>
        <div class="form-grid">
            <div class="form-group">
                <label>ID Paciente</label>
                <input type="number" id="idPaciente" placeholder="1">
            </div>
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Maria Garcia">
            </div>
            <div class="form-group">
                <label>Parentesco</label>
                <input type="text" id="parentesco" placeholder="Madre, Padre, Hermano...">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" id="telefono" placeholder="999888777">
            </div>
            <div class="form-group">
                <label>Dirección</label>
                <input type="text" id="direccion" placeholder="Av. Lima 456">
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="correo" placeholder="maria@email.com">
            </div>
            <div class="form-group">
                <label>¿Es Principal?</label>
                <input type="checkbox" id="esPrincipal" style="width:20px;height:20px;margin-top:8px">
            </div>
        </div>
        <br>
        <button class="btn btn-primary" onclick="registrarContacto()">Registrar Contacto</button>
    </div>

    <div class="card">
        <h2>Buscar Contactos por Paciente</h2>
        <div class="search-row">
            <input type="number" id="buscarId" placeholder="ID del paciente">
            <button class="btn btn-search" onclick="buscar()">Buscar</button>
        </div>
    </div>

    <div class="card">
        <h2>Lista de Contactos</h2>
        <table>
            <thead>
                <tr><th>ID</th><th>Nombre</th><th>Parentesco</th><th>Teléfono</th><th>Correo</th><th>Principal</th></tr>
            </thead>
            <tbody id="bodyContactos">
                <tr><td colspan="6" style="text-align:center;color:#888">Busca por ID de paciente</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const API = 'http://localhost:8080';

async function registrarContacto() {
    const idPaciente = document.getElementById('idPaciente').value;
    const body = {
        paciente: { idPaciente: parseInt(idPaciente) },
        nombreCompleto: document.getElementById('nombre').value,
        parentesco: document.getElementById('parentesco').value,
        telefono: document.getElementById('telefono').value,
        direccion: document.getElementById('direccion').value,
        correoElectronico: document.getElementById('correo').value,
        esPrincipal: document.getElementById('esPrincipal').checked
    };
    const res = await fetch(`${API}/api/contactos-emergencia`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    const msg = document.getElementById('msg');
    if (res.ok) {
        msg.className = 'msg-ok'; msg.style.display = 'block';
        msg.textContent = 'Contacto registrado correctamente.';
        document.getElementById('buscarId').value = idPaciente;
        buscar();
    } else {
        msg.className = 'msg-err'; msg.style.display = 'block';
        msg.textContent = await res.text() || 'Error al registrar contacto.';
    }
}

async function buscar() {
    const id = document.getElementById('buscarId').value;
    if (!id) return;
    const tbody = document.getElementById('bodyContactos');
    const res = await fetch(`${API}/api/contactos-emergencia/paciente/${id}`);
    if (!res.ok) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#c5221f">${await res.text()}</td></tr>`;
        return;
    }
    const data = await res.json();
    if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888">Sin resultados</td></tr>';
        return;
    }
    tbody.innerHTML = data.map(c => `
        <tr>
            <td>${c.idContacto}</td>
            <td>${c.nombreCompleto}</td>
            <td>${c.parentesco ?? '-'}</td>
            <td>${c.telefono ?? '-'}</td>
            <td>${c.correoElectronico ?? '-'}</td>
            <td>${c.esPrincipal ? '⭐ Sí' : 'No'}</td>
        </tr>
    `).join('');
}
</script>
</body>
</html>
